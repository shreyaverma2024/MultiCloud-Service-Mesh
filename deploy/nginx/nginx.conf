# Multi-Cloud Service Mesh - AWS EC2 deployment TLS proxy.
#
# This is the ONLY publicly reachable entry point on the EC2 instance. It
# terminates TLS with a self-managed certificate and forwards traffic to the
# private Docker network:
#
#   8443/tcp -> api-gateway:8080      (public API, HMAC on cross-cloud routes)
#   8444/tcp -> control-plane:4000    (token-protected management API)
#   8445/tcp -> cache-api:4100        (x-api-key protected cache API)
#   5433/tcp -> postgres:5432         (TLS to PostgreSQL, TLS required by pg_hba)
#
# PostgreSQL is never published directly. Nginx also connects to PostgreSQL
# with TLS and verifies the server certificate against the same self-managed CA.
#
# The certificate must contain these SANs:
#   DNS:postgres, DNS:localhost, DNS:<aws-public-host>, IP:127.0.0.1,
#   IP:<aws-public-ip>
# Generate it with deploy/tls/gen-certs.sh.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Internal health endpoint used by the container healthcheck.
  server {
    listen 127.0.0.1:8080;
    server_name _;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain always;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }

  # Public API Gateway.
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HTTPS:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 2m;

    location / {
      proxy_pass http://api-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }

  # Control Plane. Render registers here; keep it token-protected and restrict
  # the security group to the Render outbound ranges plus your administrator IP.
  server {
    listen 8444 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CONTROL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;

    location / {
      proxy_pass http://control-plane:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }

  # Cache API. Every request still requires x-api-key: CACHE_API_KEY.
  server {
    listen 8445 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CACHE:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;

    location / {
      proxy_pass http://cache-api:4100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}

stream {
  # PostgreSQL is not published on the host. Render connects to this TLS
  # listener; Nginx verifies PostgreSQL's certificate before forwarding.
  server {
    listen 5433 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PG:10m;
    ssl_session_timeout 10m;

    proxy_connect_timeout 10s;
    proxy_timeout 300s;
    proxy_pass postgres:5432;

    proxy_ssl on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_name postgres;
    proxy_ssl_server_name on;
  }
}
